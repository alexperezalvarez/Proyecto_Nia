{% extends 'base.html' %}
{% block title %}Iniciar Sesión - SketchForge{% endblock %}

{% block content %}
<div class="container mt-4 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg sf-corner sf-scanline">
                <div class="card-body p-3">
                    <div class="text-center mb-3">
                        <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 0 24px var(--glow)">
                            <i class="bi bi-brush-fill" style="font-size:1.4rem;color:#04101a"></i>
                        </div>
                        <h4 class="fw-bold mb-1" style="letter-spacing:0.06em;text-transform:uppercase">Bienvenido</h4>
                        <p class="text-muted mb-0" style="font-size:0.88rem">Inicia sesión en SketchForge</p>
                    </div>

                    <form method="post" action="{% url 'account_login' %}">
                        {% csrf_token %}
                        <div class="mb-2">
                            <label for="id_login" class="form-label mb-1">Usuario o correo</label>
                            <input type="text" name="login" id="id_login" class="form-control form-control-sm"
                                   placeholder="Nombre de usuario o correo" required>
                        </div>
                        <div class="mb-2">
                            <label for="id_password" class="form-label mb-1">Contraseña</label>
                            <input type="password" name="password" id="id_password" class="form-control form-control-sm"
                                   placeholder="Contraseña" required>
                        </div>
                        <div class="mb-2 form-check">
                            <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
                            <label for="id_remember" class="form-check-label" style="font-size:0.82rem;text-transform:none;letter-spacing:0">Recordarme</label>
                        </div>
                        {% if redirect_field %}
                        <input type="hidden" name="{{ redirect_field.name }}" value="{{ redirect_field.value }}">
                        {% endif %}
                        <button type="submit" class="sf-btn sf-btn-primary w-100 py-1 mt-1">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-2">
                        <a href="{% url 'account_reset_password' %}" class="text-muted" style="font-size:0.82rem;text-decoration:none">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
                        <span style="color:var(--text-muted);font-size:0.86rem">¿No tienes cuenta? </span>
                        <a href="{% url 'accounts:register' %}" style="font-weight:700;text-decoration:none;font-size:0.86rem">
                            Regístrate
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
