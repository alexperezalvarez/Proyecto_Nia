{% extends 'base.html' %}
{% block title %}Iniciar Sesión - SketchForge{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg" style="border:1px solid var(--border);background:var(--card-bg)">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div style="width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#2d8ceb,#17a589);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
                            <i class="bi bi-brush-fill" style="font-size:1.5rem;color:white"></i>
                        </div>
                        <h3 class="fw-bold" style="letter-spacing:-0.5px">Bienvenido</h3>
                        <p class="text-muted" style="font-size:0.88rem">Inicia sesión en SketchForge</p>
                    </div>

                    <form method="post" action="{% url 'account_login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_login" class="form-label" style="font-size:0.85rem">Usuario o correo</label>
                            <input type="text" name="login" id="id_login" class="form-control"
                                   placeholder="Nombre de usuario o correo" required
                                   style="padding:10px 12px;border-radius:6px">
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label" style="font-size:0.85rem">Contraseña</label>
                            <input type="password" name="password" id="id_password" class="form-control"
                                   placeholder="Contraseña" required
                                   style="padding:10px 12px;border-radius:6px">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
                            <label for="id_remember" class="form-check-label" style="font-size:0.85rem">Recordarme</label>
                        </div>
                        {% if redirect_field %}
                        <input type="hidden" name="{{ redirect_field.name }}" value="{{ redirect_field.value }}">
                        {% endif %}
                        <button type="submit" class="btn w-100 py-2 mt-1"
                                style="background:#2d8ceb;border:none;color:white;font-weight:600;border-radius:6px">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'account_reset_password' %}" class="text-muted" style="font-size:0.82rem;text-decoration:none">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
                        <span style="color:var(--text-muted);font-size:0.85rem">¿No tienes cuenta? </span>
                        <a href="{% url 'accounts:register' %}" style="color:#2d8ceb;font-weight:600;text-decoration:none;font-size:0.85rem">
                            Regístrate
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
