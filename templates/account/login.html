{% extends 'base.html' %}
{% block title %}Iniciar Sesión - SketchForge{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg sf-corner sf-scanline">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 0 30px var(--glow)">
                            <i class="bi bi-brush-fill" style="font-size:1.6rem;color:#04101a"></i>
                        </div>
                        <h3 class="fw-bold" style="letter-spacing:0.06em;text-transform:uppercase">Bienvenido</h3>
                        <p class="text-muted" style="font-size:0.92rem">Inicia sesión en SketchForge</p>
                    </div>

                    <form method="post" action="{% url 'account_login' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_login" class="form-label">Usuario o correo</label>
                            <input type="text" name="login" id="id_login" class="form-control"
                                   placeholder="Nombre de usuario o correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Contraseña</label>
                            <input type="password" name="password" id="id_password" class="form-control"
                                   placeholder="Contraseña" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
                            <label for="id_remember" class="form-check-label" style="font-size:0.85rem;text-transform:none;letter-spacing:0">Recordarme</label>
                        </div>
                        {% if redirect_field %}
                        <input type="hidden" name="{{ redirect_field.name }}" value="{{ redirect_field.value }}">
                        {% endif %}
                        <button type="submit" class="sf-btn sf-btn-primary w-100 py-2 mt-1">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'account_reset_password' %}" class="text-muted" style="font-size:0.85rem;text-decoration:none">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
                        <span style="color:var(--text-muted);font-size:0.88rem">¿No tienes cuenta? </span>
                        <a href="{% url 'accounts:register' %}" style="font-weight:700;text-decoration:none;font-size:0.88rem">
                            Regístrate
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
